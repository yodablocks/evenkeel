[project]
name = "evenkeel"
dynamic = ["version"]
description = "Failure classification, retries with hints, dollar budgets and escalation for LangChain agents. Ported from keel."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "yodablocks"}]
keywords = ["langchain", "langgraph", "agents", "middleware", "retries", "budgets", "human-in-the-loop", "jev"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "langchain>=1.3,<2",
    "langgraph>=1,<2",
    "typing-extensions>=4.7",
]

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.7,<0.8"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15"]

[project.urls]
Repository = "https://github.com/yodablocks/evenkeel"
keel = "https://github.com/yodablocks/keel"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The version lives in evenkeel/__init__.py only.
[tool.hatch.version]
path = "evenkeel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["evenkeel"]

[tool.hatch.build.targets.sdist]
include = ["/evenkeel", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The Jev prompt is kept word for word as in keel, so both classifiers ask the same question.
"evenkeel/jev.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
